# Onboard virtual keyboard - large keys for finger use on the tablet
# Install to: ~/.config/onboard/onboard.conf (user gta4xlwifi)

[keyboard]
KeyboardLayout=Compact

[view]
# Large keys
KeyWidth=90
KeyHeight=80
KeyboardHeight=420
# Bottom of the screen
Orientation=bottom
XPosition=0
YPosition=-420

[theme]
Theme=HighContrast
KeyLabelColor=#FFFFFF
KeyFillColor=#333333
KeyPressedFillColor=#666666

[general]
AutoShow=true
ShowTaskbar=true
